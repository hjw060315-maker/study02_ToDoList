<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>할 일 관리</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <h1>할 일 관리</h1>
      <time id="today"></time>
    </header>

    <p id="storage-warning" class="warning" hidden>저장되지 않을 수 있음 (브라우저 저장소를 사용할 수 없습니다)</p>

    <section class="progress" aria-label="진행률">
      <div id="progress-text" class="progress-text"></div>
      <div class="bar"><div id="progress-fill" class="bar-fill"></div></div>
      <ul id="mini-progress" class="mini-progress"></ul>
    </section>

    <form id="add-form" class="add-form">
      <input id="add-text" type="text" maxlength="100" placeholder="할 일을 입력하세요" aria-label="할 일 입력" autocomplete="off">
      <select id="add-category" aria-label="카테고리">
        <option value="work">업무</option>
        <option value="personal">개인</option>
        <option value="study">공부</option>
      </select>
      <button type="submit">추가</button>
    </form>

    <nav id="tabs" class="tabs" aria-label="카테고리 필터">
      <button type="button" data-filter="all" class="active">전체</button>
      <button type="button" data-filter="work">업무</button>
      <button type="button" data-filter="personal">개인</button>
      <button type="button" data-filter="study">공부</button>
    </nav>

    <ul id="todo-list" class="todo-list"></ul>
    <p id="empty" class="empty" hidden>할 일을 추가해 보세요</p>

    <footer class="footer">
      <button id="clear-done" type="button">완료 항목 지우기</button>
    </footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
